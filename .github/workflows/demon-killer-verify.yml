name: Demon Killer verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/demon-killer-verify.yml'
      - 'index.html'
      - 'test-center.js'
      - 'test-center.html'
      - 'test-center.css'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: Node contract and simulated gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Default new repositories to main
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
      - name: Parse and verify game
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          node --version
          node --check test-center.js
          node --check dk-skills.js
          node --check cult-network.js
          node --test tests/test-center.cjs tests/menu.cjs tests/intro.cjs tests/cult-system.cjs tests/cult-integration.cjs tests/population.cjs tests/cult-network.cjs tests/skills.cjs
