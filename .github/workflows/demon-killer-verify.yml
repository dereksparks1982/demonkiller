name: Demon Killer verification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/demon-killer-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    name: Node contract and simulated gameplay
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Default new repositories to main
        run: git config --global init.defaultBranch main
      - uses: actions/checkout@v5
      - name: Parse and verify game
        env:
          NODE_OPTIONS: --throw-deprecation
        run: |
          node --version
          node --check test-center.js
          node --test tests/test-center.cjs tests/menu.cjs tests/intro.cjs
