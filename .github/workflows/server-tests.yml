name: DK Server tests
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'index.html'
      - 'test-center.html'
      - 'temple-ui.js'
      - 'outdoor.html'
      - 'outdoor-ui.js'
      - 'sector-terrain-m32.js'
      - 'streaming-cell-shells-m33.js'
      - 'world-regions.js'
      - 'dk-menu-server.js'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server regression suite
        run: npm test --prefix server
