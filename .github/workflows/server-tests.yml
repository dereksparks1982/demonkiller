name: DK Server tests
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'tests/**'
      - 'index.html'
      - 'test-center.html'
      - 'temple-ui.js'
      - 'outdoor.html'
      - 'outdoor-ui.js'
      - 'sector-terrain-m32.js'
      - 'streaming-cell-shells-m33.js'
      - 'streaming-cell-contents-m34.js'
      - 'world-regions.js'
      - 'dk-menu-server.js'
      - '.github/workflows/server-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
jobs:
  server-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test shard ${{ matrix.shard }} (isolated processes, hard deadlines)
        id: regression
        run: node tests/ci-runner.cjs --shard=${{ matrix.shard }} --shards=6 --timeout-ms=60000
      - name: Publish diagnostic commit status and run link
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_OUTCOME: ${{ steps.regression.outcome }}
          FAILED_FILES: ${{ steps.regression.outputs.failed }}
          SHARD: ${{ matrix.shard }}
          HEAD_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const shard=Number(process.env.SHARD)+1;
          const outcome=process.env.TEST_OUTCOME||'error';
          const state=outcome==='success'?'success':outcome==='failure'?'failure':'error';
          const list=(process.env.FAILED_FILES||'').slice(0,100);
          const description=(state==='success'?'All assigned test files passed':
            list?'Failed: '+list:'Test runner '+outcome).slice(0,140);
          const url='https://github.com/'+process.env.GITHUB_REPOSITORY+
            '/actions/runs/'+process.env.RUN_ID;
          const endpoint='https://api.github.com/repos/'+
            process.env.GITHUB_REPOSITORY+'/statuses/'+process.env.HEAD_SHA;
          fetch(endpoint,{
            method:'POST',
            headers:{
              Authorization:'Bearer '+process.env.GH_TOKEN,
              Accept:'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'Content-Type':'application/json'
            },
            body:JSON.stringify({state,description,
              context:'DK Server tests / shard '+shard+'/6',target_url:url})
          }).then(async response=>{
            if(!response.ok)console.warn('Diagnostic commit status unavailable: '+response.status);
          }).catch(error=>console.warn('Diagnostic status unavailable: '+error.message));
          NODE
