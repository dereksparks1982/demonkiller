name: One-time approved wall tile extraction
on:
  push:
    branches: [main]
    paths:
      - 'scripts/split-approved-walls.py'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python scripts/split-approved-walls.py
      - name: Commit original extracted wall tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/temple/walls/wall_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Replace wall sprite files with 80 approved atlas extractions"
            git push origin HEAD:main
          fi
