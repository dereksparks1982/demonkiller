name: One-time import original 0x72 dungeon set
on:
  push:
    branches: [main]
    paths:
      - scripts/import-ox72-first-dungeon.py
permissions:
  contents: write
jobs:
  binary-atlas-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Get image and official-archive verification dependencies
        run: python -m pip install --quiet Pillow==11.3.0 requests==2.32.3
      - name: Verify the exact creator source against the owner uploads
        run: python scripts/import-ox72-first-dungeon.py
      - name: Commit game atlas and retire the one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/dkarchitect/imported/ox72-first-game-atlas.png assets/art/dkarchitect/imported/first-catalog.js assets/art/dkarchitect/imported/first-manifest.json
          git rm .github/workflows/import-ox72-first-dungeon-once.yml
          git commit -m "Add 243 original 0x72 Dungeon Tileset sprites [skip ci]"
          git push origin HEAD:main
