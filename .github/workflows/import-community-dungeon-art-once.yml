name: One-time integrate creator dungeon art
on:
  push:
    branches: [main]
    paths: [scripts/import-community-dungeon-art.py]
permissions:
  contents: write
jobs:
  one-time-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install binary-image tooling for this one-time import
        run: python -m pip install --quiet Pillow==11.3.0 requests==2.32.3
      - name: Fetch and verify exact creator-supplied free uploads; build game atlas
        run: python scripts/import-community-dungeon-art.py
      - name: Commit in-game atlas only; remove workflow to prevent reruns
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/dkarchitect/imported/
          git rm .github/workflows/import-community-dungeon-art-once.yml
          git commit -m "Import approved dungeon artwork as in-game atlas [skip ci]"
          git push origin HEAD:main
