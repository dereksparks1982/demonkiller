name: One-time approved crystal sprite extraction
on:
  push:
    branches: [main]
    paths:
      - 'scripts/split-approved-crystals.py'

permissions:
  contents: write

jobs:
  split-approved-crystals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python scripts/split-approved-crystals.py
      - run: |
          node tests/test-center.cjs
          node tests/intro.cjs
      - name: Commit individual sprites to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/crystals/crystal_*.png
          if ! git diff --cached --quiet; then
            git commit -m "Add 19 extracted approved crystal sprite PNGs"
            git push origin HEAD:main
          fi
