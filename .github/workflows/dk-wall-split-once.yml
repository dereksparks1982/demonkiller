name: One-time owner wall sheet extraction
on:
  push:
    branches: [main]
    paths:
      - scripts/split-dk-architect-walls.py
permissions:
  contents: write
jobs:
  extract-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow for binary image extraction
        run: python -m pip install --quiet Pillow==11.3.0
      - name: Split all 106 source sprites without changing their pixels
        run: python scripts/split-dk-architect-walls.py
      - name: Publish once; retire the workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/art/dkarchitect/walls
          git rm .github/workflows/dk-wall-split-once.yml
          git commit -m "Publish 106 transparent DK wall objects and five matching grid stones [skip ci]"
          git push origin HEAD:main
