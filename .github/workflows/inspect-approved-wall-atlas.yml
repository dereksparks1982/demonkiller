name: Inspect approved wall atlas (one time)
on:
  push:
    branches: [main]
    paths:
      - scripts/inspect-approved-wall-atlas.py
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet Pillow==11.3.0
      - run: python scripts/inspect-approved-wall-atlas.py
